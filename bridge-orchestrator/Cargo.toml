[package]
name = "bridge-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Single-writer bridge orchestrator for lock-watcher and coupon-signer flows"

[dependencies]
# Defaults off to keep TLS pure-Rust: alloy's default `reqwest` feature selects
# reqwest's default-tls (-> native-tls -> the host's openssl), and Cargo features
# cannot be subtracted. This binary is built on an operator's host and scp'd to a
# droplet, so `reqwest-rustls-tls` keeps TLS self-contained, trusting bundled webpki
# roots rather than the host store. It no longer keeps `openssl-sys` out of the tree
# altogether — since 0.7, holochain_keystore forces lair_keystore's
# `rusqlite-bundled-sqlcipher-vendored-openssl` — but that copy is vendored and built
# from source for sqlcipher, off this TLS path. `std` and `map` are the rest of
# `default` apart from its `map-foldhash`, which has no alloy feature — so alloy's
# maps use std's SipHash builder.
alloy = { version = "0.8", default-features = false, features = [
    "std",
    "map",
    "full",
    "reqwest-rustls-tls",
    "signer-local",
] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
ham = { git = "https://github.com/unytco/ham.git", branch = "main-0.7" }
hex = "0.4"
hmac = "0.12"
holo_hash = { version = "0.7.0", features = ["encoding"] }
holochain_client = "0.9.0"
holochain_zome_types = "0.7.0"
rave_engine = "0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmp-serde = "1.1"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
zfuel = "0.9.0"
